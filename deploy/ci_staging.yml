variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  BRANCH: "$CI_COMMIT_BRANCH"

deploy_staging_all:
  stage: deploy
  interruptible: false
  needs:
    - job: test
    # Optional: the branch rules for the build are narrower than the deploy rules
    # (e.g. test_ci), so the build job may not exist in this pipeline.
    - job: build_runtime_container
      optional: true
  image: willhallonline/ansible:2.18.6-alpine-3.18
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - DEPLOY_TAG="main-runtime" ansible-playbook -i "$ANSIBLE_INV" deploy/staging.yml --limit sstaging
  environment:
    name: staging
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main"
      when: on_success
