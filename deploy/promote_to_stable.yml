---
- name: Promote a Beta image to Stable
  hosts: "{{ ansible_limit | default('all') }}"
  tasks:
    - include_tasks: tasks/facts.yml
    - include_tasks: tasks/registry.yml
    - include_tasks: tasks/deploy_stable_tagged.yml
    - include_tasks: tasks/deploy_rest.yml

    # DEPLOY_TAG here is the *beta* sha being promoted, so the scheduler stays on beta-lineage
    # code - i.e. never older than the bots enqueueing tasks for it.
    - include_tasks: tasks/deploy_scheduler.yml
