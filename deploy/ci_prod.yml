variables:
  IMAGE_NAME: "$CI_REGISTRY_IMAGE"
  BRANCH: "$CI_COMMIT_BRANCH"

deploy_prod_beta:
  stage: deploy
  interruptible: false
  needs:
    - job: test
    # Optional: the branch rules for the build are narrower than the deploy rules
    # (e.g. test_ci), so the build job may not exist in this pipeline.
    - job: build_runtime_container
      optional: true
  image: willhallonline/ansible:2.18.6-alpine-3.18
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - DEPLOY_TAG="${CI_COMMIT_SHORT_SHA}-runtime" ansible-playbook -i "$ANSIBLE_INV" deploy/beta.yml --limit sprod
  environment:
    name: prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual


deploy_prod_stable:
  stage: deploy
  interruptible: false
  needs:
    - job: test
    # Optional: the branch rules for the build are narrower than the deploy rules
    # (e.g. test_ci), so the build job may not exist in this pipeline.
    - job: build_runtime_container
      optional: true
  image: willhallonline/ansible:2.18.6-alpine-3.18
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - DEPLOY_TAG="${CI_COMMIT_SHORT_SHA}-runtime" ansible-playbook -i "$ANSIBLE_INV" deploy/stable.yml --limit sprod
  environment:
    name: prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual

# ── Rollback / Promote ────────────────────────────────────────────────────────
# Trigger these manually from CI/CD → Pipelines → Run pipeline.
# Set ROLLBACK_TAG or PROMOTE_TAG to a <sha>-runtime value shown by
# list_beta_deployments (e.g. "abc1234-runtime").

list_beta_deployments:
  stage: deploy
  interruptible: false
  needs: []
  image: alpine:3.24
  before_script:
    - apk add --no-cache curl jq
  script:
    - |
      echo "Available beta deploy tags (newest first):"
      curl --silent --header "PRIVATE-TOKEN: $CI_API_TOKEN" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories" \
        | jq -r '.[0].id' \
        | xargs -I{} curl --silent --header "PRIVATE-TOKEN: $CI_API_TOKEN" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/registry/repositories/{}/tags?per_page=50" \
        | jq -r '.[] | select(.name | test("^[0-9a-f]+-runtime$")) | "\(.name)\t\(.created_at)"' \
        | sort -k2 -r
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual

rollback_prod_beta:
  stage: deploy
  interruptible: false
  needs: []
  image: willhallonline/ansible:2.18.6-alpine-3.18
  variables:
    ROLLBACK_TAG: ""
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - |
      if [ -z "$ROLLBACK_TAG" ]; then
        echo "ERROR: ROLLBACK_TAG must be set (e.g. abc1234-runtime)"
        exit 1
      fi
    - DEPLOY_TAG="$ROLLBACK_TAG" ansible-playbook -i "$ANSIBLE_INV" deploy/rollback_beta.yml --limit sprod
  environment:
    name: prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual

rollback_prod_stable:
  stage: deploy
  interruptible: false
  needs: []
  image: willhallonline/ansible:2.18.6-alpine-3.18
  variables:
    ROLLBACK_TAG: ""
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - |
      if [ -z "$ROLLBACK_TAG" ]; then
        echo "ERROR: ROLLBACK_TAG must be set (e.g. abc1234-runtime)"
        exit 1
      fi
    - DEPLOY_TAG="$ROLLBACK_TAG" ansible-playbook -i "$ANSIBLE_INV" deploy/rollback_stable.yml --limit sprod
  environment:
    name: prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual

promote_beta_to_stable:
  stage: deploy
  interruptible: false
  needs: []
  image: willhallonline/ansible:2.18.6-alpine-3.18
  # NOTE: intentionally no `variables: PROMOTE_TAG: ""` default here. A job-level
  # default shadows variables passed at manual-run time, so setting it would make
  # PROMOTE_TAG un-overridable. Leaving it unset lets the in-script fallback and
  # any manual/pipeline override both work.
  before_script:
    - cp $SSHKEY /tmp/sshkey
    - chmod 600 /tmp/sshkey
  script:
    - |
      # Default to the beta commit this pipeline was triggered on so the
      # one-click manual "play" works. Override PROMOTE_TAG to promote a
      # different tag (see list_beta_deployments for available tags).
      DEPLOY_TAG="${PROMOTE_TAG:-${CI_COMMIT_SHORT_SHA}-runtime}"
      echo "Promoting image tag: $DEPLOY_TAG"
    - DEPLOY_TAG="${PROMOTE_TAG:-${CI_COMMIT_SHORT_SHA}-runtime}" ansible-playbook -i "$ANSIBLE_INV" deploy/promote_to_stable.yml --limit sprod
  environment:
    name: prod
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH == "test_ci" || $CI_COMMIT_BRANCH == "test-ci"
      when: manual
