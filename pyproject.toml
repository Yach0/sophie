[project]
name = "sophie_bot"
version = "4.5.1"
description = "Sophie is modern and fast Telegram chat manager bot"
authors = [{ name = "Yacha", email = "yacha@orangefox.tech" }]
requires-python = ">=3.14,<4"
dependencies = [
    "aiogram>=3.29,<4",
    "redis>=8,<9",
    "dnspython>=2.8.0,<3",
    "ujson>=5.12.1,<6",
    "PyYAML>=6.0.3,<7",
    "sentry-sdk>=2.60.0,<3",
    "Babel>=2.18.0,<3",
    "regex>=2026.5.9",
    "pydantic>=2.13.4,<3",
    "emoji-country-flag>=2.1.0,<3",
    "pydantic-settings>=2.14.1,<3",
    "structlog>=26.1,<27",
    "stfu-tg>=4",
    "ass-tg>=2.4.7",
    "beanie>=2.1.0,<3",
    "openai>=2.37.0,<3",
    "lingua-language-detector>=2.2.0,<3",
    "numpy>=2.4.5,<3",
    "pillow>=12.2.0,<13",
    "mem-top>=0.2.1,<0.3",
    "apscheduler>=3.11.2,<4",
    "pydantic-ai-slim[openai,openrouter,tavily]>=2,<3",
    "tenacity>=9.1.4,<10",
    "mistralai>=2.4.5,<3",
    "fastapi>=0.141,<0.142",
    "uvicorn>=0.52,<0.53",
    "uvloop>=0.22.1,<0.23",
    "pyjwt>=2.12.1,<3",
    "init-data-py>=0.2.7,<0.3",
    "normality>=3.1.0",
    "av>=18,<19",
    "openapi-client",
    "psutil>=7.2.2,<8",
    "ussr @ git+https://gitlab.com/SophieBot/ussr.git",
    "torch>=2.13.0,<3",
    "torchvision>=0.28.0,<0.29",
]

[dependency-groups]
dev = [
    "Nuitka>=4.1",
    "pycln>=2.6.0,<3",
    "bandit>=1.9.4,<2",
    "ruff>=0.15.13",
    "devtools[pygments]>=0.12.2,<0.13",
    "types-ujson>=5.10.0.20250822,<6",
    "types-pytz>=2026.2.0.20260506,<2027",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-xdist>=3.8.0,<4",
    "allure-pytest>=2.16.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "fakeredis>=2.35.1,<3",
    "ty>=0.0.37",
    "babel>=2.18.0",
    "watchfiles>=1.1.1,<2",
    "mongomock>=4.3.0,<5",
    "aiogram-test-framework>=1.0.3",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
stfu-tg = { git = "https://gitlab.com/SophieBot/stf.git" }
ass-tg = { git = "https://gitlab.com/SophieBot/ass.git" }
openapi-client = { git = "https://github.com/kagisearch/kagi-openapi-python.git" }
ussr = { git = "https://gitlab.com/SophieBot/ussr.git" }
torch = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[tool.ty.src]
include = ["sophie_bot/**"]
exclude = ["**/legacy_modules/**", "**/legacy_*.py", "**/stfu_gallery.py"]

[tool.ty.environment]
python-version = "3.14"
# Pin ty to the project's freshly-synced virtualenv. The CI image ships a
# prebuilt /sophie/.venv and `before_script` unsets VIRTUAL_ENV, so without
# this ty resolves imports against that prebuilt env instead of the freshly
# `uv sync`-ed one and reports false unresolved-import / invalid-await
# diagnostics.
python = "./.venv"

# NOTE: target-version is intentionally pinned below requires-python (3.14).
# Ruff's 3.14 formatter strips parentheses from multi-type except clauses
# ('except (A, B):' -> 'except A, B:'), but pycln/libcst cannot parse the
# unparenthesized form and fails with a SyntaxError. Keeping the target at
# py313 preserves the parenthesized form so both tools agree.
[tool.ruff]
line-length = 120
target-version = "py313"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error",
    "ignore:cannot collect test class 'TestClient':pytest.PytestCollectionWarning",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sophie_bot*"]
