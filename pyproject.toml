[project]
name = "sophie_bot"
version = "4.3.6"
description = "Sophie is modern and fast Telegram chat manager bot"
authors = [{ name = "Yacha", email = "yacha@orangefox.tech" }]
requires-python = ">=3.12,<4"
dependencies = [
    "aiogram>=3.27.0,<4",
    "redis>=7.4.0,<8",
    "dnspython>=2.8.0,<3",
    "ujson>=5.12.0,<6",
    "PyYAML>=6.0.3,<7",
    "sentry-sdk>=2.58.0,<3",
    "Babel>=2.18.0,<3",
    "async-timeout>=5.0.1,<6",
    "regex>=2026.4.4",
    "pydantic>=2.12.5,<3",
    "emoji-country-flag>=2.1.0,<3",
    "pydantic-settings>=2.14.0,<3",
    "structlog>=25.5.0,<26",
    "stfu-tg>=3.5,<4",
    "ass-tg",
    "beanie>=2.1.0,<3",
    "openai>=2.33.0,<3",
    "lingua-language-detector>=2.2.0,<3",
    "numpy>=2.4.4,<3",
    "pillow>=12.2.0,<13",
    "mem-top>=0.2.1,<0.3",
    "apscheduler>=3.11.2,<4",
    "pydantic-ai-slim[openai,openrouter,tavily]>=1.88.0,<2",
    "mistralai @ https://files.pythonhosted.org/packages/0f/74/0f6188190e79eef4363754c71414c1a791537b1e506cbee615bb581cb05f/mistralai-2.4.4-py3-none-any.whl",
    "fastapi>=0.136.1,<0.137",
    "uvicorn>=0.46.0,<0.47",
    "uvloop>=0.22.1,<0.23",
    "unidecode>=1.4.0,<2",
    "pyjwt>=2.12.1,<3",
    "link>=2.1.5,<3",
    "init-data-py>=0.2.7,<0.3",
    "ty>=0.0.33",
    "normality>=3.1.0",
    "av>=17.0.1,<18",
]

[dependency-groups]
dev = [
    "Nuitka>=4.0.8",
    "pycln>=2.6.0,<3",
    "bandit>=1.9.4,<2",
    "ruff>=0.15.12",
    "devtools[pygments]>=0.12.2,<0.13",
    "types-ujson>=5.10.0.20250822,<6",
    "types-pytz>=2026.1.1.20260408,<2027",
    "pytest-asyncio>=1.3.0,<2",
    "pytest-xdist>=3.8.0,<4",
    "allure-pytest>=2.16.0,<3",
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.1.0,<8",
    "fakeredis>=2.35.1,<3",
    "ty>=0.0.33",
    "babel>=2.18.0",
    "watchfiles>=1.1.1,<2",
    "mongomock>=4.3.0,<5",
    "aiogram-test-framework>=1.0.3",
]

[tool.uv.sources]
stfu-tg = { path = "./libs/stf" }
ass-tg = { path = "./libs/ass" }

[tool.ty.src]
include = ["sophie_bot/**"]
exclude = ["**/legacy_modules/**", "**/legacy_*.py"]

[tool.ty.environment]
python-version = "3.12"

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = "."
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
filterwarnings = [
    "error",
    "ignore:cannot collect test class 'TestClient':pytest.PytestCollectionWarning",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sophie_bot*"]
