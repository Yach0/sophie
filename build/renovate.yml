renovate:
  stage: test
  image: ghcr.io/renovatebot/renovate:43
  allow_failure: true
  rules:
    - if: $RENOVATE_TOKEN || $RENOVATE_GITHUB_TOKEN || $RENOVATE_GITHUB_COM_TOKEN
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_GITLAB_IGNORE_PR_AUTHOR: "true"
  script:
    - renovate SophieBot/sophie
