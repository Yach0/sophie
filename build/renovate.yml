renovate:
  stage: test
  image: ghcr.io/renovatebot/renovate:43
  allow_failure: true
  rules:
    - if: $RENOVATE_TOKEN || $RENOVATE_GITHUB_TOKEN || $RENOVATE_GITHUB_COM_TOKEN
  variables:
    RENOVATE_PLATFORM: "gitlab"
    RENOVATE_GITLAB_IGNORE_PR_AUTHOR: "true"
  before_script:
    - rm -rf libs
    - mkdir -p libs
    - git clone --depth 1 https://gitlab.com/SophieBot/stf.git libs/stf
    - git clone --depth 1 https://gitlab.com/SophieBot/ass.git libs/ass
  script:
    - renovate SophieBot/sophie
