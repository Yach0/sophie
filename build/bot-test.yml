.test-base:
  image: "$CI_IMAGE"
  stage: test
  interruptible: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
  variables:
    TOKEN: "123456:test"
  before_script:
    - mkdir -p libs
    - git clone --depth 1 https://gitlab.com/SophieBot/stf.git libs/stf
    - git clone --depth 1 https://gitlab.com/SophieBot/ass.git libs/ass
    - unset VIRTUAL_ENV
    - uv sync --frozen
    - uv run pybabel compile -d locales -D sophie --use-fuzzy

test-codestyle:
  extends: .test-base
  script:
    - pycln . -a -c
    - ruff format sophie_bot/ --check
    - ruff check .

test-codeanal:
  extends: .test-base
  script:
    - ty check

test-qodana:
  image:
    name: jetbrains/qodana-python-community:2026.1
    entrypoint: [""]
  cache:
    - key: qodana-2026.1-$CI_DEFAULT_BRANCH-$CI_COMMIT_REF_SLUG
      fallback_keys:
        - qodana-2026.1-$CI_DEFAULT_BRANCH-
        - qodana-2026.1-
      paths:
        - .qodana/cache
  variables:
    QODANA_TOKEN: $QODANA_TOKEN
    QODANA_ENDPOINT: "https://qodana.cloud"
  script:
    - qodana --cache-dir=$CI_PROJECT_DIR/.qodana/cache

test-unit:
  extends: .test-base
  coverage: '/^TOTAL.*\s+(\d+%)$/'
  script:
    - uv run pytest tests/ -v --ignore=tests/e2e --ignore=tests/test_migrations.py --alluredir=allure_results/unit -x -n auto --cov=sophie_bot --cov-report=xml:coverage.xml --cov-report=term-missing:skip-covered
  artifacts:
    when: always
    paths:
      - allure_results
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 day

test-e2e:
  extends: .test-base
  script:
    - uv run pytest tests/e2e -v --alluredir=allure_results/e2e
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

test-migrations:
  extends: .test-base
  script:
    - RUN_MIGRATIONS_ON_STARTUP=true MONGO_DB=sophie_test_migrations uv run pytest tests/test_migrations.py -v --alluredir=allure_results/migrations
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

report-coverage:
  extends: .test-base
  needs:
    - job: test-unit
      artifacts: true
      optional: true
  script:
    - uv run deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
  rules:
    - if: $DEEPSOURCE_DSN
