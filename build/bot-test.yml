prepare_test_env:
  stage: prepare
  image: "$UV_IMAGE"
  needs:
    - job: prepare_libs
      artifacts: true
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .cache/uv
    policy: pull-push
  before_script:
    - |
      apt-get update && \
      apt-get install -y --no-install-recommends gnupg wget && \
      echo "deb http://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list && \
      apt-get update && \
      apt-get install -y --no-install-recommends -t trixie \
        pkg-config libicu-dev g++ ffmpeg \
        libavformat-dev libavcodec-dev libavdevice-dev \
        libavutil-dev libavfilter-dev libswscale-dev libswresample-dev && \
      rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/trixie.list
  script:
    - uv sync --dev --frozen
    - uv run pybabel compile -d locales -D sophie --use-fuzzy
  artifacts:
    paths:
      - .venv/
      - libs/
      - locales/
    expire_in: 1 day

# Base template for all test jobs
.test-base:
  image: "$UV_IMAGE"
  stage: test
  needs:
    - job: prepare_test_env
      artifacts: true
  variables:
    TOKEN: "123456:test"
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .cache/uv
    policy: pull
  before_script:
    - |
      apt-get update && \
      apt-get install -y --no-install-recommends gnupg wget && \
      echo "deb http://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list && \
      apt-get update && \
      apt-get install -y --no-install-recommends -t trixie \
        libicu76 \
        ffmpeg \
        libavformat61 libavcodec61 libavdevice61 \
        libavutil59 libavfilter10 libswscale8 libswresample5 && \
      rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/trixie.list

test-codestyle:
  extends: .test-base
  script:
    - .venv/bin/python -m pycln . -a -c
    - .venv/bin/ruff format sophie_bot/ --check
    - .venv/bin/ruff check .

test-codeanal:
  extends: .test-base
  script:
    - .venv/bin/ty check

deepsource-analyze:
  extends: .test-base
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends gnupg wget curl
    - curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh
  script:
    - ./bin/deepsource report --analyzer python
  rules:
    - if: $DEEPSOURCE_DSN

test-unit:
  extends: .test-base
  script:
    - .venv/bin/python -m pytest tests/ -v --ignore=tests/e2e --ignore=tests/test_migrations.py --alluredir=allure_results/unit -x -n auto --cov=sophie_bot --cov-report=xml:coverage.xml
  artifacts:
    when: always
    paths:
      - allure_results
      - coverage.xml
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    expire_in: 1 day

test-e2e:
  extends: .test-base
  script:
    - .venv/bin/python -m pytest tests/e2e -v --alluredir=allure_results/e2e
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

test-migrations:
  extends: .test-base
  script:
    - RUN_MIGRATIONS_ON_STARTUP=true MONGO_DB=sophie_test_migrations .venv/bin/python -m pytest tests/test_migrations.py -v --alluredir=allure_results/migrations
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

report-coverage:
  extends: .test-base
  needs:
    - job: test-unit
      artifacts: true
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends curl
    - curl -fsSL https://cli.deepsource.com/install | BINDIR=./bin sh
  script:
    - ./bin/deepsource report --analyzer test-coverage --key python --value-file ./coverage.xml
  rules:
    - if: $DEEPSOURCE_DSN
