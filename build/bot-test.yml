prepare_test_env:
  stage: prepare
  image: "$UV_IMAGE"
  needs:
    - job: prepare_libs
      artifacts: true
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .cache/uv
    policy: pull-push
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends pkg-config libicu-dev g++ ffmpeg libavformat-dev libavcodec-dev libavdevice-dev libavutil-dev libavfilter-dev libswscale-dev libswresample-dev
  script:
    - uv sync --dev --frozen
    - uv run pybabel compile -d locales -D sophie --use-fuzzy
  artifacts:
    paths:
      - .venv/
      - libs/
      - locales/
    expire_in: 1 day

# Base template for all test jobs
.test-base:
  image: "$UV_IMAGE"
  stage: test
  needs:
    - job: prepare_test_env
      artifacts: true
  variables:
    TOKEN: "123456:test"
  cache:
    key:
      files:
        - pyproject.toml
        - uv.lock
    paths:
      - .cache/uv
    policy: pull

test-codestyle:
  extends: .test-base
  script:
    - .venv/bin/python -m pycln . -a -c
    - .venv/bin/ruff format sophie_bot/ --check
    - .venv/bin/ruff check .

test-codeanal:
  extends: .test-base
  script:
    - .venv/bin/ty check

test-unit:
  extends: .test-base
  script:
    - .venv/bin/python -m pytest tests/ -v --ignore=tests/e2e --ignore=tests/test_migrations.py --alluredir=allure_results/unit -x -n auto
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

test-e2e:
  extends: .test-base
  script:
    - .venv/bin/python -m pytest tests/e2e -v --alluredir=allure_results/e2e
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day

test-migrations:
  extends: .test-base
  script:
    - RUN_MIGRATIONS_ON_STARTUP=true MONGO_DB=sophie_test_migrations .venv/bin/python -m pytest tests/test_migrations.py -v --alluredir=allure_results/migrations
  artifacts:
    when: always
    paths:
      - allure_results
    expire_in: 1 day
