build_runtime_container:
  image: quay.io/podman/stable:latest
  stage: build
  interruptible: true
  # Empty needs: the image build does not depend on the tests, so it starts
  # immediately alongside them. The deploy jobs are what gate on both.
  needs: []
  variables:
    IMAGE_FULL: "$CI_REGISTRY_IMAGE:$CI_COMMIT_BRANCH-runtime"
    CACHE_IMAGE: "$CI_REGISTRY_IMAGE/cache/runtime"
    # The build only needs the working tree; libs are cloned separately.
    GIT_DEPTH: "1"
  before_script:
    - podman login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" registry.gitlab.com
    - rm -rf libs
    - mkdir -p libs
    - git clone --depth 1 https://gitlab.com/SophieBot/stf.git libs/stf
    - git clone --depth 1 https://gitlab.com/SophieBot/ass.git libs/ass
    - rm -rf libs/*/.git
    # Fix mtimes to ensure deterministic build cache layers
    - find libs pyproject.toml uv.lock -exec touch -t 200001010000 {} + || true
  script:
    - |
      podman build \
        --platform linux/amd64 \
        --format docker \
        --file build/runtime/Dockerfile \
        --layers \
        --cache-from "$CACHE_IMAGE" \
        --cache-to "$CACHE_IMAGE" \
        --build-arg BUILDKIT_INLINE_CACHE=1 \
        --build-arg BRANCH_NAME="${CI_COMMIT_BRANCH:-Local}" \
        --build-arg COMMIT_HASH="${CI_COMMIT_SHORT_SHA:-unknown}" \
        --tag "$IMAGE_FULL" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-runtime" \
        .
    - podman push "$IMAGE_FULL"
    - podman push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA-runtime"
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /^(main|dev_.*|dev-.*)$/'
    - when: never
