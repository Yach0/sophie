build_linux_onefile:
  stage: build
  image: "$UV_IMAGE"
  needs:
    - job: prepare_libs
      artifacts: true
  variables:
    CCACHE_DIR: "$CI_PROJECT_DIR/.cache/ccache"
  before_script:
    - |
      apt-get update && \
      apt-get install -y --no-install-recommends gnupg wget && \
      echo "deb http://deb.debian.org/debian trixie main" > /etc/apt/sources.list.d/trixie.list && \
      apt-get update && \
      apt-get install -y --no-install-recommends -t trixie \
        patchelf ccache pkg-config libicu-dev g++ \
        libavformat-dev libavcodec-dev libavdevice-dev \
        libavutil-dev libavfilter-dev libswscale-dev libswresample-dev && \
      rm -rf /var/lib/apt/lists/* /etc/apt/sources.list.d/trixie.list
    - ccache -s
    - uv sync --with dev --frozen
  script:
    - uv run make build_onefile
    - ccache -s
  artifacts:
    name: "$CI_JOB_STAGE-$CI_COMMIT_REF_NAME"
    paths:
      - output/
    expire_in: 1 week
  cache:
    - key:
        files:
          - pyproject.toml
          - uv.lock
      paths:
        - .cache/uv
      policy: pull-push
    - key: onefile-ccache
      paths:
        - .cache/ccache
      policy: pull-push
  rules:
    - changes:
        - build/onefile/**
        - .gitlab-ci.yml
        - sophie_bot/**
        - locales/**
        - pyproject.toml
        - uv.lock
        - Makefile
    - when: never


